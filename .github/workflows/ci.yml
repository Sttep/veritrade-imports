name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint
        # No bloquea todavia: hay deuda de lint preexistente en codigo activo
        # (pages/, dashboard_camiones.py, scripts/, pipeline/) sin arreglar aun.
        # Ver issue liz-* de bd para el seguimiento. Quitar continue-on-error
        # una vez que el conteo llegue a cero.
        run: uv run ruff check .
        continue-on-error: true

      - name: Test
        run: uv run pytest -q
