[project]
name = "veritrade-imports"
version = "0.1.0"
description = "Pipeline de estructuracion y normalizacion de importaciones vehiculares Veritrade + dashboard Streamlit"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "streamlit>=1.35.0",
    "plotly>=5.18.0",
    "pyarrow>=14.0.0",
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
    "openai>=1.0.0",
    "rapidfuzz>=3.0.0",
    "xlsxwriter>=3.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["_legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "playwright>=1.61.0",
]
